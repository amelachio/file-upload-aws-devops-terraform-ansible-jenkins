---
- name: Configure frontend server
  hosts: frontend
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install Python, pip, venv and Nginx
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - nginx
        state: present

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Create frontend application directory
      file:
        path: /var/www/frontend/templates
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create Python virtual environment for frontend
      command: python3 -m venv /var/www/frontend/venv
      args:
        creates: /var/www/frontend/venv

    - name: Install Python packages for frontend
      pip:
        name:
          - flask
          - requests
          - gunicorn
        virtualenv: /var/www/frontend/venv
        virtualenv_command: python3 -m venv

    - name: Deploy frontend config.py
      copy:
        dest: /var/www/frontend/config.py
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        content: |
          BACKEND_URL = "http://{{ groups['backend'][0] }}"

    - name: Deploy frontend systemd service
      copy:
        dest: /etc/systemd/system/frontend.service
        content: |
          [Unit]
          Description=Gunicorn instance for the file upload frontend
          After=network.target

          [Service]
          User=ubuntu
          Group=www-data
          WorkingDirectory=/var/www/frontend
          Environment="PATH=/var/www/frontend/venv/bin"
          ExecStart=/var/www/frontend/venv/bin/gunicorn --workers 3 --bind 0.0.0.0:8080 app:app

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon for frontend
      systemd:
        daemon_reload: true

    - name: Enable frontend service
      systemd:
        name: frontend
        enabled: true

    - name: Deploy Nginx config for frontend
      copy:
        dest: /etc/nginx/sites-available/frontend
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 20M;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Enable frontend Nginx site
      file:
        src: /etc/nginx/sites-available/frontend
        dest: /etc/nginx/sites-enabled/frontend
        state: link

    - name: Remove default Nginx site (frontend)
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart Nginx (frontend)
      systemd:
        name: nginx
        state: restarted

- name: Configure backend server
  hosts: backend
  become: true
  vars_files:
    - vars/secrets.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install Python, pip, venv and Nginx
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - nginx
        state: present

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Create backend application directory
      file:
        path: /var/www/backend
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create Python virtual environment for backend
      command: python3 -m venv /var/www/backend/venv
      args:
        creates: /var/www/backend/venv

    - name: Install Python packages for backend
      pip:
        name:
          - flask
          - boto3
          - pymysql
          - gunicorn
        virtualenv: /var/www/backend/venv
        virtualenv_command: python3 -m venv

    - name: Deploy backend config.py
      copy:
        dest: /var/www/backend/config.py
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        content: |
          DB_HOST = "{{ groups['db'][0] }}"
          DB_NAME = "{{ db_name }}"
          DB_USER = "{{ db_user }}"
          DB_PASSWORD = "{{ db_password }}"
          S3_BUCKET = "file-upload-babe42bf"
          S3_REGION = "ca-central-1"

    - name: Deploy backend systemd service
      copy:
        dest: /etc/systemd/system/backend.service
        content: |
          [Unit]
          Description=Gunicorn instance for the file upload backend
          After=network.target

          [Service]
          User=ubuntu
          Group=www-data
          WorkingDirectory=/var/www/backend
          Environment="PATH=/var/www/backend/venv/bin"
          ExecStart=/var/www/backend/venv/bin/gunicorn --workers 3 --bind 0.0.0.0:8080 app:app

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable backend service
      systemd:
        name: backend
        enabled: true

    - name: Deploy Nginx config for backend
      copy:
        dest: /etc/nginx/sites-available/backend
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 20M;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Enable backend Nginx site
      file:
        src: /etc/nginx/sites-available/backend
        dest: /etc/nginx/sites-enabled/backend
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted

- name: Configure database server
  hosts: db
  become: true
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install MariaDB server
      apt:
        name: mariadb-server
        state: present
    
    - name: Set MariaDB bind-address to allow remote connections
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address\s*='
        line: 'bind-address            = 0.0.0.0'
      notify: Restart MariaDB
 
    - name: Start and enable MariaDB
      service:
        name: mariadb
        state: started
        enabled: true
    
    - name: Install PyMySQL for Ansible MySQL modules
      apt:
        name: python3-pymysql
        state: present

    - name: Create application database
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create application database user
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        host: "%"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create files table
      community.mysql.mysql_query:
        login_db: "{{ db_name }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query: |
          CREATE TABLE IF NOT EXISTS files (
            id INT AUTO_INCREMENT PRIMARY KEY,
            original_name VARCHAR(255) NOT NULL,
            s3_key VARCHAR(255) NOT NULL,
            file_type VARCHAR(100) NOT NULL,
            uploaded_at DATETIME NOT NULL
          )

  handlers:
    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted

- name: Configure Jenkins server
  hosts: jenkins
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Check if swap is already active
      command: swapon --show=NAME --noheadings
      register: swap_check
      changed_when: false

    - name: Create swap file
      command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile
      when: swap_check.stdout == ""

    - name: Set swap file permissions
      file:
        path: /swapfile
        mode: '0600'
      when: swap_check.stdout == ""

    - name: Format swap file
      command: mkswap /swapfile
      when: swap_check.stdout == ""

    - name: Enable swap file
      command: swapon /swapfile
      when: swap_check.stdout == ""

    - name: Add swap to fstab
      lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Install Java (required for Jenkins)
      apt:
        name: fontconfig
        state: present

    - name: Install OpenJDK 21
      apt:
        name: openjdk-21-jre
        state: present

    - name: Clean root GPG state (prevents corrupted keyring issues)
      file:
        path: /root/.gnupg
        state: absent

    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'
        force: true

    - name: Add Jenkins apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: true

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      service:
        name: jenkins
        state: started
        enabled: true
