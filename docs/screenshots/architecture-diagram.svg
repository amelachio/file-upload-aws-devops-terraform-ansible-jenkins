<svg width="900" height="680" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="680" fill="#ffffff"/>

<!-- Users -->
<rect x="370" y="16" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="450" y="41" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Utilisateurs (web)</text>

<!-- GitHub -->
<rect x="20" y="16" width="150" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="95" y="41" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">GitHub</text>

<!-- arrows from users -->
<line x1="410" y1="56" x2="290" y2="120" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="490" y1="56" x2="700" y2="120" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="330" y="90" font-family="sans-serif" font-size="11" fill="#5F5E5A">HTTP(S)</text>
<text x="610" y="90" font-family="sans-serif" font-size="11" fill="#5F5E5A">fichiers (GET)</text>

<!-- GitHub -> Jenkins -->
<path d="M95 56 L95 240 L200 240" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="100" y="200" font-family="sans-serif" font-size="11" fill="#534AB7">git push</text>

<!-- Internet Gateway -->
<rect x="220" y="120" width="140" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="290" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Internet Gateway</text>

<!-- CloudFront -->
<rect x="640" y="120" width="140" height="40" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="710" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500A">CloudFront (CDN)</text>

<!-- S3 -->
<rect x="640" y="190" width="140" height="50" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="710" y="211" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500A">S3 Bucket</text>
<text x="710" y="228" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3B6D11">accès public bloqué</text>
<line x1="710" y1="160" x2="710" y2="190" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- IGW -> VPC -->
<line x1="290" y1="160" x2="290" y2="188" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- VPC container -->
<rect x="60" y="190" width="620" height="450" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="80" y="212" font-family="sans-serif" font-size="14" font-weight="700" fill="#0C447C">VPC — 10.0.0.0/16 (ca-central-1)</text>

<!-- Public subnet -->
<rect x="80" y="228" width="580" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="96" y="248" font-family="sans-serif" font-size="12" font-weight="600" fill="#085041">Sous-réseau public — 10.0.1.0/24</text>

<rect x="96" y="262" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="161" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Frontend EC2</text>
<text x="161" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">Flask + Nginx</text>

<rect x="240" y="262" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="305" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Ansible EC2</text>
<text x="305" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">bastion / config</text>

<rect x="384" y="262" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="449" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Jenkins EC2</text>
<text x="449" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">CI/CD</text>

<rect x="528" y="262" width="116" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="586" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#633806">NAT Gateway</text>
<text x="586" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#854F0B">accès sortant</text>

<!-- Private subnet backend -->
<rect x="80" y="400" width="280" height="160" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="96" y="420" font-family="sans-serif" font-size="12" font-weight="600" fill="#712B13">Sous-réseau privé — 10.0.2.0/24</text>
<rect x="100" y="435" width="240" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="220" y="465" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Backend EC2</text>
<text x="220" y="482" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">Flask + Gunicorn + Nginx</text>
<text x="220" y="498" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">IAM Role → S3</text>

<!-- Private subnet db -->
<rect x="380" y="400" width="280" height="160" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="396" y="420" font-family="sans-serif" font-size="12" font-weight="600" fill="#26215C">Sous-réseau privé — 10.0.3.0/24</text>
<rect x="400" y="435" width="240" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="520" y="465" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Database EC2</text>
<text x="520" y="482" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">MariaDB</text>
<text x="520" y="498" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">accès Ansible Vault</text>

<!-- Frontend -> Backend -->
<path d="M161 332 L161 380 L220 380 L220 433" fill="none" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="170" y="378" font-family="sans-serif" font-size="10" fill="#5F5E5A">IP privée</text>

<!-- Backend -> DB -->
<line x1="340" y1="485" x2="398" y2="485" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Backend -> S3 (goes outside VPC) -->
<path d="M340 460 L680 460 L680 215" fill="none" stroke="#639922" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="440" y="452" font-family="sans-serif" font-size="10" fill="#3B6D11">upload / delete (boto3, sans clé en dur)</text>

<!-- Ansible -> backend/db (bastion) -->
<path d="M305 332 L305 400" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<path d="M305 332 L500 332 L500 400" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="315" y="365" font-family="sans-serif" font-size="10" fill="#5F5E5A">SSH bastion</text>

<!-- Jenkins -> frontend/backend (deploy) -->
<path d="M449 332 L161 332" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M449 332 L220 400" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="440" y="350" font-family="sans-serif" font-size="10" fill="#534AB7">déploiement SCP/SSH</text>

<!-- NAT -> IGW -->
<path d="M586 262 L586 175 L360 145" fill="none" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Legend -->
<rect x="80" y="600" width="580" height="60" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="96" y1="618" x2="116" y2="618" stroke="#2C2C2A" stroke-width="1.2"/>
<text x="122" y="622" font-family="sans-serif" font-size="10" fill="#2C2C2A">flux applicatif</text>
<line x1="96" y1="638" x2="116" y2="638" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
<text x="122" y="642" font-family="sans-serif" font-size="10" fill="#5F5E5A">SSH (bastion / déploiement)</text>
<line x1="300" y1="618" x2="320" y2="618" stroke="#639922" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="326" y="622" font-family="sans-serif" font-size="10" fill="#3B6D11">accès S3 via IAM Role</text>
<line x1="300" y1="638" x2="320" y2="638" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 3"/>
<text x="326" y="642" font-family="sans-serif" font-size="10" fill="#854F0B">accès sortant (NAT)</text>
</svg>
