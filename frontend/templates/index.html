<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>File Management - AWS 3-Tier Project</title>
    <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #232f3e; }
    .upload-box { border: 2px dashed #ccc; padding: 20px; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    th { background-color: #232f3e; color: white; }
    tr:nth-child(even) td { background-color: #f5f5f5; }
    tr:nth-child(odd) td { background-color: #ffffff; }
    a { color: #ff9900; }
    .actions { white-space: nowrap; }
    .icon-btn { border: none; background: none; cursor: pointer; font-size: 18px; padding: 4px 8px; text-decoration: none; }
    .icon-btn:hover { opacity: 0.7; }
    .rename-form { display: none; margin-top: 6px; }
    .rename-form.visible { display: flex; gap: 6px; }
    </style>
</head>
<body>
    <h1>File Management - Projet AWS 3-Tier</h1>

    <div class="upload-box">
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/jpeg,image/png,application/pdf" required>
            <button type="submit">Uploader</button>
        </form>
    </div>

    <h2>Fichiers uploadés</h2>

    {% if files %}
    <table>
        <tr>
            <th>Nom</th>
            <th>Type</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
        {% for file in files %}
        <tr>
            <td><a href="{{ file.url }}" target="_blank">{{ file.filename }}</a></td>
            <td>{{ file.file_type }}</td>
            <td>{{ file.uploaded_at }}</td>
            <td class="actions">
                <a href="{{ file.download_link }}" class="icon-btn" title="Télécharger">⬇️</a>
                <button type="button" class="icon-btn" title="Renommer" onclick="toggleRename({{ file.id }})">✏️</button>
                <form action="/delete/{{ file.id }}" method="post" style="display:inline;" onsubmit="return confirm('Supprimer ce fichier définitivement ?');">
                    <button type="submit" class="icon-btn" title="Supprimer">🗑️</button>
                </form>
                <form id="rename-{{ file.id }}" class="rename-form" action="/rename/{{ file.id }}" method="post">
                    <input type="text" name="new_name" placeholder="Nouveau nom" size="14" required>
                    <button type="submit">OK</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>Aucun fichier uploadé pour le moment.</p>
    {% endif %}

    <script>
        function toggleRename(id) {
            const form = document.getElementById('rename-' + id);
            form.classList.toggle('visible');
        }
    </script>
</body>
</html>
