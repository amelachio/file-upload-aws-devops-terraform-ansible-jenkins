<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>File Upload - AWS 3-Tier Project</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #232f3e; }
        .upload-box { border: 2px dashed #ccc; padding: 20px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background-color: #f5f5f5; }
        .btn-delete { background-color: #d9534f; color: white; border: none; padding: 6px 12px; cursor: pointer; }
        a { color: #ff9900; }
    </style>
</head>
<body>
    <h1>Sauvegarde de fichiers - Projet AWS 3-Tier</h1>

    <div class="upload-box">
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/jpeg,image/png,application/pdf" required>
            <button type="submit">Uploader</button>
        </form>
    </div>

    <h2>Fichiers uploadés</h2>

    {% if files %}
    <table>
        <tr>
            <th>Nom</th>
            <th>Type</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
        {% for file in files %}
        <tr>
            <td><a href="{{ file.url }}" target="_blank">{{ file.filename }}</a></td>
            <td>{{ file.file_type }}</td>
            <td>{{ file.uploaded_at }}</td>
            <td>
                <form action="/delete/{{ file.id }}" method="post" style="display:inline;">
                    <button type="submit" class="btn-delete">Supprimer</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>Aucun fichier uploadé pour le moment.</p>
    {% endif %}
</body>
</html>
